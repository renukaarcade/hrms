                `
        <div class="section-title">All Bookings (${rows.length} records)</div>
        <table><thead><tr><th>#</th><th>Guest</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Nights</th><th>Amount</th><th>Status</th></tr></thead><tbody>
          ${rows.map((b) => `<tr><td>#${b.booking_id}</td><td>${b.guest_name}<br><small>${b.guest_phone}</small></td><td>${b.room_number} (${b.room_type})</td><td>${b.check_in}</td><td>${b.check_out}</td><td>${b.nights}</td><td>₹${parseFloat(b.total_amount).toLocaleString("en-IN")}</td><td>${b.status}</td></tr>`).join("")}
        </tbody></table>`,
              );
          } else if (type === "guests") {
            const data = await api("/guests");
            if (!data) return;
            if (format === "csv")
              downloadCSV("guests_report.csv", data, [
                "guest_id",
                "name",
                "phone",
                "email",
                "address",
                "id_proof",
                "id_number",
                "created_at",
              ]);
            else if (format === "json")
              downloadJSON("guests_report.json", data);
            else
              printReport(
                "Guests Report",
                `
        <div class="section-title">All Registered Guests (${data.length})</div>
        <table><thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Email</th><th>ID Proof</th><th>ID Number</th><th>Registered</th></tr></thead><tbody>
          ${data.map((g) => `<tr><td>${g.guest_id}</td><td>${g.name}</td><td>${g.phone}</td><td>${g.email || "—"}</td><td>${g.id_proof || "—"}</td><td>${g.id_number || "—"}</td><td>${fmtDate(g.created_at)}</td></tr>`).join("")}
        </tbody></table>`,
              );
          } else if (type === "payments") {
            const data = await api("/payments");
            if (!data) return;
            const total = data
              .filter((p) => p.payment_status === "paid")
              .reduce((a, p) => a + p.amount, 0);
            if (format === "csv")
              downloadCSV("payments_report.csv", data, [
                "payment_id",
                "guest_name",
                "room_number",
                "check_in",
                "check_out",
                "amount",
                "payment_method",
                "payment_status",
                "paid_at",
              ]);
            else if (format === "json")
              downloadJSON("payments_report.json", data);
            else
              printReport(
                "Payments Report",
                `
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-val">₹${parseFloat(total).toLocaleString("en-IN")}</div><div class="stat-lbl">Total Collected</div></div>
          <div class="stat-box"><div class="stat-val">${data.filter((p) => p.payment_status === "paid").length}</div><div class="stat-lbl">Paid</div></div>
          <div class="stat-box"><div class="stat-val">${data.filter((p) => p.payment_status === "pending").length}</div><div class="stat-lbl">Pending</div></div>
          <div class="stat-box"><div class="stat-val">${data.length}</div><div class="stat-lbl">Total Records</div></div>
        </div>
        <div class="section-title">Payment Transactions</div>
        <table><thead><tr><th>#</th><th>Guest</th><th>Room</th><th>Amount</th><th>Method</th><th>Status</th><th>Paid At</th></tr></thead><tbody>
          ${data.map((p) => `<tr><td>#${p.payment_id}</td><td>${p.guest_name}</td><td>${p.room_number}</td><td>₹${parseFloat(p.amount).toLocaleString("en-IN")}</td><td>${p.payment_method}</td><td>${p.payment_status}</td><td>${p.paid_at ? fmtDate(p.paid_at) : "—"}</td></tr>`).join("")}
        </tbody></table>`,
              );
          } else if (type === "rooms") {
            const data = await api("/rooms");
            if (!data) return;
            if (format === "csv")
              downloadCSV("rooms_report.csv", data, [
                "room_id",
                "room_number",
                "room_type",
                "price",
                "status",
                "floor",
                "description",
              ]);
            else if (format === "json") downloadJSON("rooms_report.json", data);
            else
              printReport(
                "Rooms Report",
                `
        <div class="section-title">All Rooms (${data.length})</div>
        <table><thead><tr><th>Room No.</th><th>Type</th><th>Floor</th><th>Price/Night</th><th>Status</th><th>Description</th></tr></thead><tbody>
          ${data.map((r) => `<tr><td>${r.room_number}</td><td>${r.room_type}</td><td>${r.floor}</td><td>₹${parseFloat(r.price).toLocaleString("en-IN")}</td><td>${r.status}</td><td>${r.description || "—"}</td></tr>`).join("")}
        </tbody></table>`,
              );
          } else if (type === "summary") {
            const [dash2, bks, pays] = await Promise.all([
              api("/reports/dashboard"),
              api("/bookings"),
              api("/payments"),
            ]);
            if (!dash2) return;
            const totalPaid = (pays || [])
              .filter((p) => p.payment_status === "paid")
              .reduce((a, p) => a + p.amount, 0);
            if (format === "csv") {
              const rows = [
                { metric: "Total Rooms", value: dash2.rooms.total },
                { metric: "Available Rooms", value: dash2.rooms.available },
                { metric: "Occupied Rooms", value: dash2.rooms.occupied },
                { metric: "Occupancy Rate (%)", value: dash2.occupancy_rate },
                { metric: "Total Bookings", value: dash2.bookings.total },
                {
                  metric: "Active Guests",
                  value: dash2.bookings.active_guests,
                },
                { metric: "Today's Revenue (INR)", value: dash2.revenue.today },
                {
                  metric: "Monthly Revenue (INR)",
                  value: dash2.revenue.monthly,
                },
                { metric: "Total Revenue Collected (INR)", value: totalPaid },
              ];
              downloadCSV("hotel_summary.csv", rows, ["metric", "value"]);
            } else if (format === "json") {
              downloadJSON("hotel_summary.json", {
                generated: new Date().toISOString(),
                dashboard: dash2,
                total_collected: totalPaid,
              });
            } else {
              printReport(
                "Hotel Summary Report",
                `
          <div class="stat-grid">
            <div class="stat-box"><div class="stat-val">${dash2.rooms.total}</div><div class="stat-lbl">Total Rooms</div></div>
            <div class="stat-box"><div class="stat-val">${dash2.occupancy_rate}%</div><div class="stat-lbl">Occupancy</div></div>
            <div class="stat-box"><div class="stat-val">${dash2.bookings.active_guests}</div><div class="stat-lbl">Active Guests</div></div>
            <div class="stat-box"><div class="stat-val">₹${parseFloat(dash2.revenue.monthly).toLocaleString("en-IN")}</div><div class="stat-lbl">Monthly Revenue</div></div>
          </div>
          <div class="section-title">Room Status Breakdown</div>
          <table><thead><tr><th>Status</th><th>Count</th><th>% of Total</th></tr></thead><tbody>
            ${[
              ["Available", dash2.rooms.available, "#4ade80"],
              ["Occupied", dash2.rooms.occupied, "#f87171"],
              ["Cleaning", dash2.rooms.cleaning, "#fbbf24"],
              ["Maintenance", dash2.rooms.maintenance, "#a78bfa"],
            ]
              .map(
                ([s, v]) =>
                  `<tr><td>${s}</td><td>${v}</td><td>${dash2.rooms.total ? Math.round((v / dash2.rooms.total) * 100) : 0}%</td></tr>`,
              )
              .join("")}
          </tbody></table>
          <div class="section-title">Booking Status Breakdown</div>
          <table><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>
            ${(dash2.booking_distribution || []).map((d) => `<tr><td style="text-transform:capitalize">${d.status.replace("_", " ")}</td><td>${d.count}</td></tr>`).join("")}
          </tbody></table>`,
              );
            }
          }
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.textContent = btn.dataset.label || btn.textContent;
          }
        }
      };

      // ── Download button component ──────────────────────────────────────────────
      function dlBtns(type) {
        return `<div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-sm" style="background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.2)"
      onclick="downloadReport('${type}','csv')" data-label="⬇ CSV">⬇ CSV</button>
    <button class="btn btn-sm" style="background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.2)"
      onclick="downloadReport('${type}','json')" data-label="⬇ JSON">⬇ JSON</button>
    <button class="btn btn-sm" style="background:rgba(201,169,110,.1);color:var(--gold);border:1px solid rgba(201,169,110,.2)"
      onclick="downloadReport('${type}','print')" data-label="🖨 Print / PDF">🖨 Print / PDF</button>
  </div>`;
      }

      async function renderReports() {
        const [dash, rev] = await Promise.all([
          api("/reports/dashboard"),
          api("/reports/revenue?period=monthly"),
        ]);
        if (!dash || !rev) return;

        const maxRev = Math.max(...rev.map((x) => x.revenue), 1);

        $("content").innerHTML = `
    <!-- ── Header ── -->
    <div class="page-header">
      <div class="page-header-left">
        <h2>Reports & Analytics</h2>
        <p>Download any report as CSV, JSON or Print as PDF</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:12px;color:var(--text-dim)">Full Summary:</span>
        ${dlBtns("summary")}
      </div>
    </div>

    <!-- ── KPI Cards ── -->
    <div class="stats-grid" style="margin-bottom:24px">
      <div class="stat-card gold">
        <div class="stat-label">Monthly Revenue</div>
        <div class="stat-value" style="font-size:22px;margin-top:8px">${fmt(dash.revenue.monthly)}</div>
        <div class="stat-sub">Today: ${fmt(dash.revenue.today)}</div>
        <div class="stat-icon">💰</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">Occupancy Rate</div>
        <div class="stat-value">${dash.occupancy_rate}%</div>
        <div class="stat-sub">${dash.rooms.occupied} / ${dash.rooms.total} rooms</div>
        <div class="stat-icon">📊</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-label">Total Bookings</div>
        <div class="stat-value">${dash.bookings.total}</div>
        <div class="stat-sub">${dash.bookings.active_guests} currently in-house</div>
        <div class="stat-icon">📋</div>
      </div>
      <div class="stat-card amber">
        <div class="stat-label">Available Rooms</div>
        <div class="stat-value">${dash.rooms.available}</div>
        <div class="stat-sub">of ${dash.rooms.total} total rooms</div>
        <div class="stat-icon">🚪</div>
      </div>
    </div>

    <!-- ── Revenue + Room Type ── -->
    <div class="grid-2" style="gap:16px;margin-bottom:16px">
      <div class="card">
        <div class="card-header">
          <div><div class="card-title">Monthly Revenue Trend</div><div class="card-subtitle">Last 12 months</div></div>
          ${dlBtns("revenue")}
        </div>
        <div style="display:flex;flex-direction:column;gap:7px">
          ${rev
            .slice(0, 8)
            .map((d) => {
              const pct = Math.round((d.revenue / maxRev) * 100);
              return `<div style="display:flex;align-items:center;gap:8px;font-size:12px">
              <span style="width:64px;color:var(--text-dim);flex-shrink:0">${d.period}</span>
              <div style="flex:1;background:var(--bg3);border-radius:3px;height:22px;overflow:hidden;position:relative">
                <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-dim));border-radius:3px;transition:width 0.6s ease"></div>
              </div>
              <span style="width:76px;text-align:right;font-family:var(--font-mono);color:var(--gold);font-size:11px">${fmt(d.revenue)}</span>
              <span style="width:28px;text-align:right;color:var(--text-mute);font-size:10px">${d.transactions}tx</span>
            </div>`;
            })
            .join("")}
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><div class="card-title">Room Type Distribution</div><div class="card-subtitle">Inventory breakdown</div></div>
          ${dlBtns("rooms")}
        </div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${(dash.room_types || [])
            .map((rt) => {
              const occPct = rt.total
                ? Math.round(((rt.total - rt.available) / rt.total) * 100)
                : 0;
              return `<div>
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                <span class="font-bold">${rt.room_type}</span>
                <div style="display:flex;gap:8px;align-items:center">
                  <span class="badge badge-available">${rt.available} avail</span>
                  <span class="text-dim">${rt.total} total</span>
                </div>
              </div>
              <div style="background:var(--bg3);border-radius:3px;height:6px;overflow:hidden">
                <div style="width:${occPct}%;height:100%;background:var(--red);border-radius:3px;transition:width 0.6s"></div>
              </div>
              <div style="font-size:10px;color:var(--text-mute);margin-top:2px">${occPct}% occupied</div>
            </div>`;
            })
            .join("")}
        </div>
      </div>
    </div>

    <!-- ── Bookings + Payments ── -->
    <div class="grid-2" style="gap:16px;margin-bottom:16px">
      <div class="card">
        <div class="card-header">
          <div><div class="card-title">Booking Status Overview</div><div class="card-subtitle">All time distribution</div></div>
          ${dlBtns("bookings")}
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${(dash.booking_distribution || [])
            .map((d) => {
              const colors = {
                confirmed: "var(--blue)",
                checked_in: "var(--green)",
                checked_out: "var(--text-dim)",
                cancelled: "var(--red)",
              };
              const col = colors[d.status] || "var(--text-dim)";
              const total =
                (dash.booking_distribution || []).reduce(
                  (a, x) => a + x.count,
                  0,
                ) || 1;
              const pct = Math.round((d.count / total) * 100);
              return `<div style="display:flex;align-items:center;gap:10px">
              <div style="width:10px;height:10px;border-radius:50%;background:${col};flex-shrink:0"></div>
              <span style="flex:1;font-size:13px;text-transform:capitalize">${d.status.replace("_", " ")}</span>
              <div style="width:100px;background:var(--bg3);border-radius:3px;height:8px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:${col};border-radius:3px"></div>
              </div>
              <span style="width:30px;text-align:right;font-size:13px;font-weight:600">${d.count}</span>
              <span style="width:34px;text-align:right;font-size:11px;color:var(--text-mute)">${pct}%</span>
            </div>`;
            })
            .join("")}
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><div class="card-title">Payment Summary</div><div class="card-subtitle">By method & status</div></div>
          ${dlBtns("payments")}
        </div>
        <div id="payment-summary-content" style="display:flex;flex-direction:column;gap:8px">
          <div class="loading-spinner" style="margin:16px auto"></div>
        </div>
      </div>
    </div>

    <!-- ── Guests ── -->
    <div class="card">
      <div class="card-header">
        <div><div class="card-title">Guest Records</div><div class="card-subtitle">Full guest database export</div></div>
        ${dlBtns("guests")}
      </div>
      <p style="font-size:13px;color:var(--text-dim)">Export all registered guest data including contact details, ID proofs, and visit history.</p>
    </div>
  `;

        // Load payment summary async
        api("/payments").then((pays) => {
          if (!pays) return;
          const el = $("payment-summary-content");
          if (!el) return;
          const byMethod = {};
          let totalPaid = 0,
            totalPending = 0;
          pays.forEach((p) => {
            byMethod[p.payment_method] =
              (byMethod[p.payment_method] || 0) + p.amount;
            if (p.payment_status === "paid") totalPaid += p.amount;
            else totalPending += p.amount;
          });
          el.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.15);border-radius:var(--radius);padding:10px">
          <div style="font-size:10px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.5px">Collected</div>
          <div style="font-size:16px;font-weight:700;color:var(--green);font-family:var(--font-mono)">${fmt(totalPaid)}</div>
        </div>
        <div style="background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.15);border-radius:var(--radius);padding:10px">
          <div style="font-size:10px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.5px">Pending</div>
          <div style="font-size:16px;font-weight:700;color:var(--amber);font-family:var(--font-mono)">${fmt(totalPending)}</div>
        </div>
      </div>
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-mute);margin-bottom:6px">By Method</div>
      ${Object.entries(byMethod)
        .map(
          ([m, v]) => `
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
          <span style="text-transform:capitalize">💳 ${m}</span>
          <span class="font-mono text-gold">${fmt(v)}</span>
        </div>`,
        )
        .join("")}
    `;
        });
      }

      // ── SYSTEM LOGS ────────────────────────────────────────────────────────────
      async function renderLogs() {
        const logs = await api("/logs");
        if (!logs) return;

        $("content").innerHTML = `
    <div class="page-header"><div class="page-header-left"><h2>System Logs</h2><p>${logs.length} recent entries</p></div></div>
    <div class="card" style="padding:0">
      <div class="table-wrap" style="max-height:70vh;overflow-y:auto">
        <table>
          <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th><th>IP</th></tr></thead>
          <tbody>
            ${logs
              .map(
                (l) => `<tr>
              <td class="font-mono text-xs text-dim">${new Date(l.created_at).toLocaleString("en-IN")}</td>
              <td class="font-bold">${l.username || "—"}</td>
              <td><span class="pill">${l.action}</span></td>
              <td class="text-sm text-dim">${l.details || "—"}</td>
              <td class="font-mono text-xs text-dim">${l.ip_address || "—"}</td>
            </tr>`,
              )
              .join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
      }

      // ── STARTUP ────────────────────────────────────────────────────────────────
      if (authToken && currentUser) {
        // Verify token is still valid
        api("/auth/me").then((data) => {
          if (data) initApp();
          else doLogout();
        });
      } else {
        $("login-screen").style.display = "flex";
      }
    </script>
  </body>
</html>
